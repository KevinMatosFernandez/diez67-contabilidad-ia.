name: Pruebas y despliegue del bot

on:
  push:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/pruebas.yml"
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Comprobar tipos
        run: deno check supabase/functions/diez67-contable2/index.ts
      - name: Pruebas
        run: deno test --allow-env --allow-read supabase/functions/diez67-contable2/index.test.ts

  # Solo despliega si las pruebas pasan, en la rama main y si existe el secreto SUPABASE_ACCESS_TOKEN.
  desplegar:
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # La CLI se instala desde npm: setup-cli con "latest" consulta la API de GitHub y falla por límite de peticiones.
      - uses: actions/setup-node@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 20
      - name: Desplegar diez67-contable2
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx --yes supabase@latest functions deploy diez67-contable2 --project-ref pyxjppzlfgmxivcfwkgv --no-verify-jwt --use-api
      - name: Aviso
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "No hay secreto SUPABASE_ACCESS_TOKEN; las pruebas pasaron pero no se desplegó nada."
