
name: DIEZ67 - Pruebas y despliegue

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar lectura de Excel
        run: python -c "from openpyxl import Workbook; w=Workbook(); w.active.append(['Producto']); w.save('/tmp/prueba.xlsx'); print('Correcto: Python y openpyxl funcionan')"

  desplegar:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: pyxjppzlfgmxivcfwkgv

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar diez67-contable2
        run: supabase functions deploy diez67-contable2 --project-ref "$PROJECT_ID"
