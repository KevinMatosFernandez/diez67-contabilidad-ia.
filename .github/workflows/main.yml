
name: Probar importador DIEZ67

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar lectura de Excel
        run: python -c "from openpyxl import Workbook; w=Workbook(); w.active.append(['Producto']); w.save('/tmp/prueba.xlsx'); print('Correcto: Python y openpyxl funcionan')"
